[project]
name = "quadruped8"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "brax==0.14.2",
    "flax==0.12.0",
    "jax==0.7.2",
    "mujoco==3.10.0",
    "mujoco-mjx==3.10.0",
    "numpy==2.5.1",
    "optax==0.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
markers = ["slow: Cadexエンジンや学習器を呼ぶ遅いテスト"]
