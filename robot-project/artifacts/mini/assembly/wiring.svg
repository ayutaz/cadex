<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="34" font-size="22" font-weight="bold" fill="#222">mini の配線（最初の構成: 電池なし、外部 5V 給電）</text>
<text x="20" y="58" font-size="14" fill="#555">GPIO の番号は仮（deploy/esp32/firmware/main/main.c の SERVO_GPIO、TODO）。実機では未確認。</text>
<rect x="150" y="80" width="950" height="96" rx="8" fill="#2d6a4f" stroke="#1b4332" stroke-width="2"/>
<text x="170" y="110" font-size="18" font-weight="bold" fill="#fff">ESP32-S3 開発ボード（ブレッドボードに挿す）</text>
<text x="170" y="132" font-size="13" fill="#d8f3dc">ピンの位置は手元のボードの印字で確かめる。USB はパソコンへ（書き込みと ESP32 の電源）</text>
<rect x="190" y="170" width="12" height="12" fill="#ffd166" stroke="#7a5c00"/>
<text x="196" y="162" font-size="12" text-anchor="middle" fill="#ffd166">GPIO4</text>
